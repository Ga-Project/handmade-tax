name: Verify

# main に到達する経路は「PR 経由」と「main への直接 push」の2つある。
# ゲートを workflow ごとに書き写すと、片方だけ更新されて穴が開く
# （実際、秘密スキャンは push 側だけ・依存監査は PR 側だけ、という状態だった）。
# そこで検査は全てこのファイルに集約し、ci.yml と pages.yml の両方から呼ぶ。
# ここに step を足せば、両方の経路に同時に効く。
#
# 各 step に if: を付けないこと。経路や条件でゲートが外れると、外れたことに
# 気づかないまま緑になる（test/workflows.test.mjs がこれを禁止している）。

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 平文シークレットの混入を全コミット履歴に対して検査する。
  # PR で落ちれば main に入る前に気づけ、push で落ちれば公開に進まない。
  # 浅いクローンだと履歴を見ないので fetch-depth: 0 が必須。
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # リリース資産はタグを付け替えても差し替えられる。取得物をハッシュで固定して、
      # 秘密を検査する側の実行ファイルがすり替わる経路を塞ぐ。
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全コミット履歴を走査する
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --no-banner --redact

  # ---------------------------------------------------------------------------
  # 公開検査ゲート（必須）。
  # この製品は basePath 未設定のまま公開され、HTML は 200 で返るのに CSS も JS も 404
  # という状態で稼働していた。変換は全て JS なので、訪問者は何もできない状態だった。
  # 生成物を読む検査は out/ が要るので、公開と同じ条件でビルドしてから検査する
  # test:publish を使う。素の `next build` + `node --test` だと out/ が無いときに
  # 成果物検査が静かにスキップされ、検出すべきリグレッションを緑で通してしまう。
  # basePath の注入はビルドコマンド（package.json の build:publish）に一本化してある。
  # ---------------------------------------------------------------------------
  checks:
    name: Lint / types / publish checks / audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 安いものから先に落とす（型・lint の誤りでフルビルドを待たせない）。
      - run: pnpm lint
      - run: pnpm typecheck
      # 公開条件でビルド → 全テスト。生成物のアセット/URL検査と、
      # 表示↔構造化データの照合を含む（test:publish が
      # HANDMADE_TAX_REQUIRE_PUBLISH_CHECK=1 を立てるので、スキップは前提テストが落として許さない）。
      - run: pnpm run test:publish
      # 依存の脆弱性監視。high/critical で落とす。既知の waive は
      # pnpm-workspace.yaml の auditConfig.ignoreGhsas に根拠付きで置く。
      # npm の advisories/bulk は応答に数分かかることがあり、既定の fetch-timeout(60s)では
      # 到達できずに赤くなる(脆弱性の有無と無関係)。上限と再試行を延ばして待つ。
      # 待ち続けて公開が止まらないよう、job 全体に timeout-minutes を掛けてある。
      - run: pnpm audit --audit-level high --fetch-timeout=600000 --fetch-retries=5 --fetch-retry-maxtimeout=180000
