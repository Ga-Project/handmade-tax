name: Deploy to GitHub Pages

# 秘密スキャン → ビルド → Pages 公開を1つの workflow で直列化する。
# スキャンが落ちたら build は skip され、Pages には何も公開されない。

on:
  push:
    branches: [main]

# 最小権限。書き込みが要るのは deploy job のみ（下で job 単位に付与）。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 平文シークレットの混入を全コミット履歴に対して検査する。
  # build はこの job を needs にするため、ここで落ちると公開に進まない。
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全コミット履歴を走査する
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --no-banner --redact

  # ---------------------------------------------------------------------------
  # 公開検査ゲート（必須）。
  # この製品は basePath 未設定のまま公開され、HTML は 200 で返るのに CSS も JS も 404
  # という状態で稼働していた。変換は全て JS なので、訪問者は何もできない状態だった。
  # 生成物を読む検査は out/ が要るので、テストの前に公開と同じ条件でビルドしておく。
  # ここでビルドしないと out/ が無く、検査が静かにスキップされたまま CI が緑になる
  # （＝安全網があるつもりで穴が開く）。
  # ---------------------------------------------------------------------------
  verify:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /handmade-tax
      - run: pnpm test # 生成物のアセット/URL検査と、表示↔構造化データの照合を含む
        env:
          # スキップを許さない。前提が崩れていたらテストとして落とす。
          HANDMADE_TAX_REQUIRE_PUBLISH_CHECK: "1"
      - run: pnpm typecheck
      - run: pnpm lint

  build:
    name: Build (static export)
    # スキャンと公開検査の両方が PASS していることが前提。fail 時は skip され公開されない。
    needs: [secret-scan, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # プロジェクトページ（<owner>.github.io/handmade-tax/）へサブパス配信するため basePath を注入。
      # ルート配信（ユーザー/組織ページ・カスタムドメイン）に切り替える場合はこの env を外す。
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /handmade-tax
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
