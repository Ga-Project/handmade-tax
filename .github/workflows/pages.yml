name: Deploy to GitHub Pages

# 検査 → ビルド → Pages 公開を1つの workflow で直列化する。
# 検査が落ちたら build は skip され、Pages には何も公開されない。
# 検査の中身は verify.yml（PR 側の ci.yml と共有）。main への直接 push でも
# PR 経由でも、通るゲートが同一になる。

on:
  push:
    branches: [main]
  # 取り消された公開をやり直すための手動再実行。検査 → ビルド → 公開の
  # 順序は needs で固定されているので、ここから起動してもゲートは飛ばせない。
  workflow_dispatch:

# 最小権限。書き込みが要るのは deploy job のみ（下で job 単位に付与）。
permissions:
  contents: read

concurrency:
  group: pages
  # 進行中の公開は最後までやらせる（途中で切ると公開が中途半端な状態で終わる）。
  cancel-in-progress: false

jobs:
  # 秘密スキャン（全履歴 gitleaks）・公開検査・型・lint・依存監査。
  # build はこの job を needs にするため、どれか1つでも落ちると公開に進まない。
  verify:
    name: Pre-deploy
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build:
    name: Build (static export)
    # 全ての検査が PASS していることが前提。fail 時は skip され公開されない。
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # プロジェクトページ（<owner>.github.io/handmade-tax/）へサブパス配信するため basePath を注入。
      # 注入値は package.json の build:publish が持つ（ここに書くと二重管理になり、
      # 片方だけ変えたときに検査が通ったビルドと公開するビルドが別物になる）。
      # ルート配信（ユーザー/組織ページ・カスタムドメイン）に切り替える場合は素の build を使う。
      - run: pnpm run build:publish
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
